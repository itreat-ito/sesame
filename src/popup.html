<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sesame</title>
    <link rel="stylesheet" href="./sass/popup.scss" />
  </head>
  <body>
    <div class="popup">
      <div class="logo">
        <img src="./images/logo_text.svg" alt="torchlight">
      </div>

      <section class="popup-status" id="statusSection">
        <div class="popup-status__domain">
          <div class="popup-status__title-row">
            <span class="popup-status__label">現在のサイト</span>
            <div class="popup-status__badge" id="statusBadge" aria-hidden="true">
              <span class="badge badge--registered">登録済み</span>
            </div>
          </div>
          <span class="popup-status__value" id="currentDomain">-</span>
        </div>
      </section>

      <section class="popup-form">
        <h2 class="ttl-s">ウェブサイトを登録</h2>
        <form id="authForm">
          <div class="form-group">
            <label for="domain">ドメイン</label>
            <input type="text" id="domain" placeholder="example.com" required />
          </div>
          <div class="form-group">
            <label for="username">ユーザー名</label>
            <input type="text" id="username" placeholder="user" required />
          </div>
          <div class="form-group">
            <label for="password">パスワード</label>
            <input type="text" id="password" placeholder="password" required />
          </div>
          <button type="submit" class="btn btn-save" id="saveBtn">保存</button>
        </form>
      </section>

      <footer class="popup-footer">
        <a href="#" id="openOptions" class="btn btn-save">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-settings"><path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915"/><circle cx="12" cy="12" r="3"/></svg>
          <span>設定</span>
        </a>
      </footer>
    </div>

    <script type="module" src="./js/popup.js"></script>
  </body>
</html>
